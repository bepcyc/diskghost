<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diskghost</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="wordmark">diskghost</span><span id="version" class="ver"></span></div>
        <form id="pathform" class="pathbox" autocomplete="off" role="search">
          <label class="sr-only" for="path" data-i18n="pathLabel">Folder path</label>
          <input id="path" type="text" spellcheck="false" data-i18n-ph="placeholder" data-i18n-title="pathKeys" />
          <button id="btn-browse" type="button" class="quiet" data-i18n="browse" data-i18n-title="keyBrowse">Browse…</button>
          <button id="btn-scan" class="primary" type="submit" data-icon="scan" data-i18n="scan" data-i18n-label="scan" data-i18n-title="scan">Scan</button>
          <button id="btn-dupes" type="button" class="quiet" data-icon="copies" data-i18n="dupes" data-i18n-label="dupes" data-i18n-title="dupes">Find duplicates</button>
        </form>
        <button id="btn-excludes" class="chip-btn" type="button"></button>
        <button id="btn-settings" class="icon-btn quiet" type="button" data-icon="gear" data-i18n-title="settings" data-i18n-label="settings" aria-label="Settings"></button>
      </header>

      <nav class="sidebar" aria-label="Drives and jobs" data-i18n-label="sideLabel">
        <section class="side-sec" aria-labelledby="h-drives">
          <div class="side-head">
            <h2 id="h-drives" class="side-title" data-i18n="drives">Drives</h2>
            <button id="btn-drive-view" class="icon-btn quiet" type="button" aria-label="Drives view" aria-pressed="false"></button>
            <button id="btn-drives-refresh" class="icon-btn quiet" type="button" data-icon="refresh" data-i18n-title="refresh" aria-label="Refresh"></button>
          </div>
          <div id="drives" class="drives"></div>
          <button id="btn-scan-all" type="button" class="wide quiet" data-i18n="scanAll">Scan all drives</button>
        </section>
        <section class="side-sec" aria-labelledby="h-jobs">
          <div class="side-head">
            <h2 id="h-jobs" class="side-title" data-i18n="scans">Scans</h2>
            <button id="btn-clear-done" class="link-btn" type="button" data-i18n="clearDone">Clear finished</button>
          </div>
          <div id="jobs-scan" class="jobs"></div>
        </section>
        <section class="side-sec" aria-labelledby="h-dupes">
          <div class="side-head">
            <h2 id="h-dupes" class="side-title" data-i18n="navDupes">Duplicate searches</h2>
          </div>
          <div id="jobs-dupes" class="jobs"></div>
        </section>
        <p id="drop-hint" class="hint" data-i18n="dropHint">Drop folders anywhere — each one is queued as its own scan.</p>
      </nav>

      <main id="main" tabindex="-1"></main>

      <footer class="statusbar">
        <span id="status" role="status" aria-live="polite"></span>
        <span id="op" class="op" hidden></span>
        <span id="queue-info"></span>
      </footer>
    </div>

    <div id="dropzone" class="dropzone" aria-hidden="true">
      <div class="dropcard" data-i18n="dropHere">Drop folders to scan them</div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <dialog id="settings-dlg" class="dlg"></dialog>
    <dialog id="confirm-dlg" class="dlg small"></dialog>

    <script src="i18n.js"></script>
    <script src="icons.js"></script>
    <script src="lib.js"></script>
    <script src="app.js"></script>
  </body>
</html>
