[package]
name = "diskghost-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fast parallel disk scanning and duplicate detection — the engine behind Diskghost."

[dependencies]
rayon = "1"
blake3 = { version = "1", features = ["mmap", "rayon"] }
globset = "0.4"
trash = "5"
fs4 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
rusqlite = { version = "0.42", features = ["bundled"] }
# Copy-policy files. 1.0.x: later 1.x needs Rust 1.85 (workspace MSRV 1.80).
toml = { version = "~1.0", default-features = false, features = ["std", "serde", "parse", "display"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scan"
harness = false
