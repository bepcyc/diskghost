[package]
name = "diskghost-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for Diskghost — fast disk usage & duplicate finder."

[[bin]]
name = "diskghost"
path = "src/main.rs"

[dependencies]
diskghost-core = { path = "../diskghost-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests take a volume offline by editing its index row (same version as core).
rusqlite = { version = "0.32", features = ["bundled"] }
